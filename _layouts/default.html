<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>

    <!-- Favicon -->
    <link rel="icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}" type="image/png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

    <!-- Tailwind & Swiper -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "brand-red": "#D42426",     // Màu đỏ Noel
                        "brand-green": "#165B33",   // Màu xanh thông
                        "brand-gold": "#F8B229",    // Màu vàng chuông
                        "brand-cream": "#FDE7EF",
                        "brand-orange": "#FF6B6B"   // Accent
                    },
                    fontFamily: {
                        hand: ['"Patrick Hand"', "cursive"],
                        sans: ['"Nunito"', "sans-serif"]
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="{{ '/assets/styles/main.css' | relative_url }}">

    <!-- Custom styles & scripts -->
    <script defer src="{{ 'assets/scripts/main.js' | relative_url }}"></script>

    <!-- Music -->
    <audio id="backgroundMusic" autoplay loop>
        <source src="{{ '/assets/audio/audio.mp3' | relative_url }}" type="audio/mpeg">
        Trình duyệt của bạn không hỗ trợ audio.
    </audio>
</head>

<body class="bg-pink-50 text-gray-900 overflow-x-hidden">
    <div id="snow-container"></div>

    {% include navbar.html %}
    {% include hero.html %}
    {% include letter.html %}
    {% include pricing.html %}
    {% include transparency.html %}
    {% include reviews.html %}
    {% include hall-of-fame.html %}
    {% include footer.html %}
    {% include donate.html %}

    <!-- Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="{{ 'assets/scripts/snow.js' | relative_url }}"></script>
    <script src="{{ 'assets/scripts/donate.js' | relative_url }}"></script>
    <script src="{{ 'assets/scripts/energy.js' | relative_url }}"></script>
    <script src="{{ 'assets/scripts/swiper-init.js' | relative_url }}"></script>
</body>

</html>
