<!-- Modal Merry Christmas -->
<div id="sponsorModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full px-8 py-10 text-center relative animate-wiggle">
        <div class="text-5xl mb-4 animate-bounce">🎄</div>
        <h3 class="text-3xl font-bold text-brand-red mb-3">Merry Christmas!</h3>
        <p class="text-gray-700 text-lg leading-relaxed">
            Bạn vừa trở thành<br />
            <span class="font-bold text-brand-red text-xl">Nhà Tài Trợ Huyền Thoại của {{ site.author }} 🎁</span><br />
            <span class="text-sm text-gray-500 italic">Không ai khác, chính bạn đã cứu lấy ngày lễ này 😇</span>
        </p>

        <a href="#goi-tai-tro" onclick="closeSponsorModal()"
            class="mt-8 inline-block bg-brand-red hover:bg-red-700 text-white font-bold px-6 py-3 rounded-full transition duration-300">
            Tiếp tục lan tỏa yêu thương ❤️
        </a>

        <!-- Snowflakes (optional) -->
        <div class="absolute top-2 right-2 text-blue-200 text-sm animate-ping">❄️</div>
        <div class="absolute bottom-2 left-4 text-blue-300 animate-spin-slow">❄️</div>
    </div>
</div>
