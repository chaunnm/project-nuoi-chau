<section id="bang-vang" class="py-20 bg-brand-cream relative overflow-hidden">
    <div class="absolute -left-10 top-20 text-9xl opacity-5 rotate-45">🔔</div>
    <div class="container mx-auto px-4 relative z-10">
        <h2
            class="text-3xl md:text-4xl font-bold mb-12 text-center text-brand-red font-hand flex justify-center items-center gap-3">
            <i class="fas fa-trophy text-brand-gold"></i> Bảng Vàng Ghi Danh
        </h2>

        <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
            {% assign hallOfFame = site.data.hall-of-fame %}
            {% for item in hallOfFame %}
            <div
                class="bg-white p-6 rounded-2xl shadow-md border-b-4 border-gray-300 hover:border-brand-red transition transform hover:-translate-y-2 group">
                <div class="text-4xl mb-4 group-hover:scale-110 transition inline-block">{{ item.icon }}</div>
                <h3 class="font-bold text-lg text-gray-800">{{ item.name }}</h3>
                <div class="{{ item.amountClass }} font-bold text-xl my-2">{{ item.amount }}</div>
                <p class="text-gray-500 italic text-sm bg-gray-50 p-3 rounded-lg">"{{ item.quote }}"</p>
            </div>
            {% endfor %}
        </div>

        <button onclick="openSponsorModal()"
            class="bg-white border-2 border-brand-red text-brand-red mt-10 px-8 py-3 rounded-full font-bold hover:bg-brand-red hover:text-white transition shadow-lg flex items-center gap-2 mx-auto">
            Xem tất cả nhà tài trợ 🎁
            <i class="fas fa-chevron-right text-xs"></i>
        </button>

        {% include sponsor-modal.html %}
    </div>
</section>
